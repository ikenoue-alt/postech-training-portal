<style>
:root{font-family:Arial,'Noto Sans JP',sans-serif;color:#183320;background:#f6f8f5;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:3px solid #2d9c4a;padding:18px 20px;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;gap:14px;align-items:center}header strong{font-size:17px}.progress{font-size:14px;color:#42644b}main{max-width:850px;margin:26px auto;padding:0 18px 130px}h1{font-size:27px;margin:18px 0 12px}h2{font-size:19px;margin:0 0 18px}p{line-height:1.8}.lead{font-size:14px;color:#536458}a{color:#247d3c}section,article{background:white;border:1px solid #dce5dc;border-radius:14px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:14px;font-weight:700;margin:0 0 7px}input,select,textarea{width:100%;padding:12px;border:1px solid #b5c6b8;border-radius:8px;font:inherit;background:white;color:inherit}textarea{min-height:100px;resize:vertical}.question-top{display:flex;align-items:start;gap:12px}.number{background:#e8f5e9;border-radius:8px;padding:7px;font-size:15px;font-weight:bold;color:#217337}.title{font-weight:700;font-size:18px;line-height:1.6}.note,.rubric{font-size:14px;color:#536458;line-height:1.8}.rubric{margin:14px 0}.rubric p{margin:4px 0}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font:inherit;cursor:pointer;border:1px solid #c9d7c9;background:white;color:#183320;border-radius:9px;padding:12px;min-height:46px}.choices button{flex:1;min-width:130px;font-size:14px;font-weight:bold}.choices button[aria-pressed=true]{background:#247d3c;color:white;border-color:#247d3c}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #70b77d;outline-offset:2px}.detail{margin-top:18px;padding-top:18px;border-top:1px solid #e5ece5}.detail[hidden]{display:none}.summary-field{margin-top:20px}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5dc;padding:14px 18px;z-index:4}.footer-inner{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}#submit{background:#247d3c;color:white;font-weight:bold;padding:13px 24px}button:disabled{opacity:.55;cursor:default}#status{white-space:pre-wrap;font-size:14px;line-height:1.7}#status[data-error=true]{color:#ad241f}.success{background:#e8f5e9;border-color:#81bc8b}.success h2{color:#217337}.draft{font-size:12px;color:#5b6d60}.draft.error{color:#ad241f}#formContent[hidden],#success[hidden]{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:0 12px 150px}section,article{padding:19px 16px}h1{font-size:23px}.title{font-size:17px}.choices button{min-width:calc(50% - 8px)}header{padding:13px 15px}.footer-inner{align-items:start;flex-direction:column}#submit{width:100%}}
</style></head><body><header><strong>フォローアップ確認</strong><span id="progress" class="progress">0 / 14</span></header><main><section style="background:#fff6dc;border-color:#d6ae51"><strong>確認用画面です。まだ提出できません。</strong><p>Google側の接続設定後に本番フォームを公開します。</p></section>
<div id="formContent"><a href="https://ikenoue-alt.github.io/postech-training-portal/">← ホームに戻る</a><h1>フォローアップ確認フォーム</h1><p class="lead">各項目の基準で1〜4点を選択してください。初回の説明・実演後、同じ項目を3回確認し、その間に必要だった追加の声掛け・補助で評価します。確認機会が足りない場合は「確認できず」。安全のための停止・相談は減点しません。</p>
<form id="reportForm"><section aria-label="基本情報"><h2>基本情報</h2><div class="grid"><div><label for="trainee">配布員名</label><input id="trainee" autocomplete="name" maxlength="100" required></div><div><label for="trainer">研修員名</label><input id="trainer" maxlength="100" required></div><div><label for="date">確認日</label><input id="date" type="date" required></div><div><label for="delivery">今回の配布</label><select id="delivery" required><option value="">選択してください</option><option>単配</option><option>併配</option></select></div></div></section><div id="questions"></div><section><h2>今回のまとめ</h2><div><label for="issue">今回の課題</label><textarea id="issue" maxlength="5000"></textarea></div><div class="summary-field"><label for="taught">今回伝えたこと・指導後の変化</label><textarea id="taught" maxlength="5000"></textarea></div><div class="summary-field"><label for="share">社員への共有</label><textarea id="share" maxlength="5000" placeholder="共有がある場合に記入してください"></textarea></div></section><p class="draft" id="draftStatus" role="status"></p></form></div>
<section id="success" class="success" hidden><h2>回答を保存しました</h2><p>研修レポートの「フォローアップ」タブに保存しました。</p><p id="savedInfo"></p><button id="next" type="button">次の配布員の回答を入力する</button></section>
</main><footer><div class="footer-inner"><span id="status" role="status" aria-live="polite">残り14項目</span><button id="submit" form="reportForm" type="submit" disabled>記録を提出する</button></div></footer>

const QUESTIONS=[{"id":"q16","note":"","options":[{"label":"実演した","value":"done"},{"label":"実演しなかった","value":"notdone"}],"originalNumber":1,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":[],"title":"研修担当者が自分で配布し、実演して見せた"},{"id":"q04","note":"完全な事業所は投函しない。住居兼事業所は投函する。この違いを見分けられたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":2,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：住居兼事業所と完全な事業所を自分で見分け、正しく判断した","3：1回の説明後は自分で正しく判断した","2：2回以上の説明・確認が必要だった","1：説明後も判断できず、担当者が投函可否を決めた"],"title":"事務所兼自宅と事業所を見分け、投函可否を正しく判断できた"},{"id":"q03","note":"敷地へ入る前にポストの位置を確認し、正規な方法で配布できたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":3,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：敷地へ入る前に自分でポストの位置を確認した","3：1回の声掛け後は入る前に確認した","2：2回以上、位置確認の声掛けが必要だった","1：担当者がポストの場所を示す必要があった"],"title":"配布前にポストの位置を確認できた"},{"id":"q12","note":"集合住宅で集合ポストの場所を自分で探し、スムーズに到達できたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":4,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：自分で案内や建物を確認し、集合ポストを見つけた","3：1回のヒント後は自分で見つけた","2：2回以上のヒント・誘導が必要だった","1：担当者が集合ポストまで案内した"],"title":"メールコーナーを見つけられた"},{"id":"q22","note":"","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":5,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：担当者が確認した範囲でポストの見落としがなかった","3：1回の指摘後は見落とさず確認した","2：2回以上、見落としの指摘が必要だった","1：指摘後も見落としが続き、担当者が確認を代行した"],"title":"ポストの見落としを減らせた"},{"id":"q08","note":"回る順番にかかわらず、当日必ず回る番地を飛ばさず、結果的に詰め配布となる効率的な回り方ができたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":6,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：対象番地を飛ばさず、自分で回る順番を決めた","3：1回の助言後は番地を飛ばさず順番を決めた","2：2回以上、回る順番の助言が必要だった","1：担当者が回る順番をその都度指示した"],"title":"効率的な配布ができた"},{"id":"q14","note":"自転車から持ち出す配布物の量を考え、配布物を取りに戻るだけの無駄足や、同じ道の往復を減らせたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":7,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：補充量と順路を考え、不要な取り戻り・往復がなかった","3：1回の助言後は不要な往復をなくせた","2：2回以上、補充量や往復について助言が必要だった","1：担当者が補充量・順路を決めても不要な往復が続いた"],"title":"無駄な往復をせず回れた"},{"id":"q17","note":"","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":9,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：安全確認以外に、チラシの準備で歩きを止めなかった","3：1回の助言後は準備による立ち止まりをなくせた","2：2回以上、持ち方や準備について助言が必要だった","1：助言後も準備のたびに止まり、動作の実演が必要だった"],"title":"安全確認が必要な場面以外は、歩きを止めずに配布できた"},{"id":"q09","note":"折れ・破れ・向きに注意し、丁寧に奥まで投函できたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":11,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：折れ・破れ・向きに問題なく、自分で投函した","3：1回の指摘後は正しく投函した","2：2回以上、折れ・破れ・向きの修正が必要だった","1：説明後も正しく投函できず、担当者が実演・修正した"],"title":"チラシを正しく投函できた"},{"id":"q10","note":"ポストの形や投函口の大きさに合わせて、持ち方・入れ方を調整できたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":13,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：投函口に合わせて自分で持ち方・入れ方を変えた","3：1回の助言後は投函口に合わせて変えられた","2：2回以上、入れ方の助言が必要だった","1：担当者が入れ方をその都度示す必要があった"],"title":"ポストに合わせて入れ方を変えられた"},{"id":"q11","note":"雨濡れや落下につながらないよう、チラシ全体をポスト内へ収められたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":14,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：確認した投函すべてでチラシ全体がポスト内に収まった","3：1回の指摘後は、はみ出しがなくなった","2：2回以上、はみ出しの修正が必要だった","1：指摘後もはみ出しが続き、担当者が入れ直した"],"title":"チラシのはみ出しを防げた"},{"id":"q13","note":"配布中に住民と会った際、自分から明るく挨拶できたか。","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":15,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：住民と会った場面で自分から挨拶した","3：1回の声掛け後は自分から挨拶した","2：2回以上、挨拶の声掛けが必要だった","1：声掛け後も挨拶せず、担当者が対応した"],"title":"住民へ挨拶できた"},{"id":"q19","note":"","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":16,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：特定した課題を、再確認時に声掛けなしで改善した","3：再確認時に1回の助言で改善した","2：再確認時に2回以上の助言で改善した","1：再確認時も改善せず、担当者の直接的な補助が必要だった"],"title":"その人の配布に大きく影響する課題を見つけ、改善できた"},{"id":"q21","note":"","options":[{"label":"4｜自立","value":"p4"},{"label":"3｜軽微フォロー","value":"p3"},{"label":"2｜継続フォロー","value":"p2"},{"label":"1｜介入必要","value":"p1"},{"label":"－ 確認できず（採点対象外）","value":"na"}],"originalNumber":17,"reasons":["理解不足","判断に迷った","忘れていた","動きがまだ身についていない","今回は実施なし・該当場面なし","その他"],"rubric":["4：教えた動作を、その後の確認場面で声掛けなしで実践した","3：1回の声掛け後は教えた動作を実践した","2：2回以上、同じ内容の声掛けが必要だった","1：声掛け後も実践できず、再実演・直接的な補助が必要だった"],"title":"教えたことを、声掛けなしで実践できた"}];
const DRAFT_KEY='postechFollowupDraftV2';
const fields=['trainee','trainer','date','delivery','issue','taught','share'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function uuid(){if(window.crypto?.randomUUID)return window.crypto.randomUUID();const a=new Uint8Array(16);window.crypto.getRandomValues(a);return Array.from(a,n=>n.toString(16).padStart(2,'0')).join('');}
function blank(){return {submissionId:uuid(),answers:{},date:today()};}
let state=blank(),busy=false;
try{const saved=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(saved&&typeof saved==='object'&&saved.answers&&/^[a-f0-9-]{32,36}$/i.test(saved.submissionId)){state={...state,...saved};for(const q of QUESTIONS){if(!q.options.some(o=>o.value===state.answers[q.id]?.value))delete state.answers[q.id];}}}catch{}
function stash(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(state));$('draftStatus').textContent='入力途中の内容は、この端末に保存されています。';$('draftStatus').classList.remove('error');}catch{$('draftStatus').textContent='この端末に入力内容を保存できません。提出が完了するまで画面を閉じないでください。';$('draftStatus').classList.add('error');}}
function needsDetail(q,value){return value&&value!=='p4'&&value!=='done';}
function update(){const count=QUESTIONS.filter(q=>state.answers[q.id]?.value).length;$('progress').textContent=count+' / '+QUESTIONS.length;if(!busy)$('status').textContent=count===QUESTIONS.length?'入力内容を確認して提出してください。':'残り'+(QUESTIONS.length-count)+'項目';}
function render(){for(const id of fields)$(id).value=state[id]||'';$('questions').innerHTML=QUESTIONS.map((q,i)=>{const a=state.answers[q.id]||{};return `<article id="question-${q.id}"><div class="question-top"><span class="number">${String(i+1).padStart(2,'0')}</span><div><div class="title">${esc(q.title)}</div>${q.note?`<p class="note">${esc(q.note)}</p>`:''}</div></div><div class="rubric">${q.rubric.map(r=>`<p>${esc(r)}</p>`).join('')}</div><div class="choices" role="group" aria-label="${esc(q.title)}">${q.options.map(o=>`<button type="button" data-question="${q.id}" data-value="${o.value}" aria-pressed="${a.value===o.value}">${esc(o.label)}</button>`).join('')}</div><div id="detail-${q.id}" class="detail" ${needsDetail(q,a.value)?'':'hidden'}><div class="grid"><div><label for="reason-${q.id}">理由</label><select id="reason-${q.id}" data-reason="${q.id}"><option value="">選択してください</option>${q.reasons.map(r=>`<option ${r===a.reason?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div><label for="note-${q.id}">今回伝えたこと</label><textarea id="note-${q.id}" data-note="${q.id}" maxlength="5000">${esc(a.note||'')}</textarea></div></div></div></article>`;}).join('');update();}
fields.forEach(id=>$(id).addEventListener('input',()=>{state[id]=$(id).value;stash();}));
$('questions').addEventListener('click',e=>{const b=e.target.closest('button[data-question]');if(!b||busy)return;const id=b.dataset.question;state.answers[id]={...(state.answers[id]||{}),value:b.dataset.value};document.querySelectorAll('[data-question="'+id+'"]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));$('detail-'+id).hidden=!needsDetail(null,b.dataset.value);stash();update();});
$('questions').addEventListener('input',e=>{const id=e.target.dataset.reason||e.target.dataset.note;if(!id)return;state.answers[id]={...(state.answers[id]||{}),[e.target.dataset.reason?'reason':'note']:e.target.value};stash();});
function validate(){for(const q of QUESTIONS){const a=state.answers[q.id];if(!a?.value){$('question-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});return '未回答の項目があります。';}if(needsDetail(q,a.value)&&!a.reason){$('reason-'+q.id).focus();return '理由を選択してください。';}if(needsDetail(q,a.value)&&a.value!=='na'&&!a.note?.trim()){$('note-'+q.id).focus();return '今回伝えたことを入力してください。';}}return '';}
function freeze(v){busy=v;document.querySelectorAll('#reportForm input,#reportForm textarea,#reportForm select,#reportForm button').forEach(e=>e.disabled=v);$('submit').disabled=v;}
$('reportForm').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const error=validate();if(error){$('status').textContent=error;$('status').dataset.error='true';return;}if(!window.google?.script?.run){$('status').textContent='まだ提出できません。担当者にフォームの接続状況を確認してください。';$('status').dataset.error='true';return;}for(const id of fields)state[id]=$(id).value;stash();freeze(true);$('status').dataset.error='false';$('status').textContent='保存しています。画面を閉じずにお待ちください。';const payload={...state,answers:{...state.answers}};window.google.script.run.withSuccessHandler(result=>{if(!result?.ok){fail(new Error('保存結果を確認できませんでした。'));return;}try{localStorage.removeItem(DRAFT_KEY);}catch{}$('formContent').hidden=true;$('success').hidden=false;$('savedInfo').textContent='配布員：'+state.trainee+' ／ 確認日：'+state.date;$('status').textContent='保存が完了しました。';$('submit').hidden=true;window.scrollTo(0,0);}).withFailureHandler(fail).submitReport(payload);});
function fail(error){freeze(false);$('status').textContent=(error?.message||'保存できませんでした。')+'\n入力内容は残っています。同じ内容で再送できます。';$('status').dataset.error='true';}
$('next').addEventListener('click',()=>{state=blank();freeze(false);$('formContent').hidden=false;$('success').hidden=true;$('submit').hidden=false;$('status').dataset.error='false';render();stash();window.scrollTo(0,0);});
render();
</script></body></html>
